<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aタイプ一括集計</title><style>
:root{--bg:#0b0f14;--panel:#111823;--panel2:#17202c;--line:#293546;--text:#eef4fb;--muted:#9aabc0;--good:#34d399;--warn:#fbbf24;--bad:#fb7185;--info:#60a5fa;--accent:#8b5cf6}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 12px;border-radius:10px}
button.primary{background:var(--accent);border-color:transparent}button.good{background:#123a2f;border-color:#1d6c55}button.warn{background:#4b3812;border-color:#7f611b}button.danger{background:#4a1d29;border-color:#7b2c40}
input,select,textarea{background:#0f1620;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;width:100%}
body{padding-bottom:40px}.app{max-width:1180px;margin:auto;padding:12px}.top{position:sticky;top:0;z-index:20;background:rgba(11,15,20,.95);backdrop-filter:blur(12px);padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
h1{font-size:20px;margin:0 auto 0 0}h2,h3{margin:0 0 10px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:10px;margin-top:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px}.span12{grid-column:span 12}.span8{grid-column:span 8}.span7{grid-column:span 7}.span6{grid-column:span 6}.span5{grid-column:span 5}.span4{grid-column:span 4}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:130px}.field label,.muted{font-size:12px;color:var(--muted)}hr{border:0;border-top:1px solid var(--line);margin:12px 0}
.badge{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line);background:#0f1620}.badge.info{color:#b8d6ff;border-color:#355f91}.badge.warn{color:#ffe08a;border-color:#755b20}.badge.good{color:#9ff0ce;border-color:#285c4d}.badge.bad{color:#ffadbb;border-color:#784052}
.big{font-size:23px;font-weight:800}.empty{padding:20px;text-align:center;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:720px}th,td{border-bottom:1px solid var(--line);padding:8px;text-align:left}th{font-size:12px;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#f8fafc;color:#111827;padding:10px 14px;border-radius:999px;display:none;z-index:100;font-weight:700}
dialog{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:14px;max-width:650px;width:calc(100% - 24px)}dialog::backdrop{background:rgba(0,0,0,.6)}
@media(max-width:820px){.span8,.span7,.span6,.span5,.span4{grid-column:span 12}.top h1{width:100%}}

.inputarea{min-height:180px;resize:vertical;line-height:1.55}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.stat{background:#0f1620;border:1px solid var(--line);border-radius:12px;padding:10px}.stat .v{font-size:19px;font-weight:800;margin-top:3px}.temp{padding:12px;border:1px solid var(--line);border-radius:13px;background:#0f1620;margin-bottom:9px}.head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}@media(max-width:600px){.stats{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="app">
  <div class="top"><h1>Aタイプ一括集計</h1><span id="syncBadge" class="badge">端末内保存</span><button onclick="window.close()">閉じる</button></div>
  <div class="grid">
    <div class="card span7">
      <h2>貼り付けて一気に計算</h2><div class="muted">1行＝「ゲーム数 BB RB」。機種名は1行目に書いても、別欄に入力しても認識します。</div><hr>
      <div class="field"><label>機種名（任意）</label><input id="model" placeholder="例：ハッピー"></div>
      <div class="field" style="margin-top:8px"><label>データ</label><textarea id="input" class="inputarea" placeholder="ハッピー&#10;2899 11 13&#10;2615 12 14&#10;1156 7 3&#10;1925 11 6"></textarea></div>
      <div class="row" style="margin-top:9px"><button id="calc" class="primary">計算</button><button id="example">例を入力</button><button id="clear">クリア</button></div>
      <div id="result" style="margin-top:12px"></div>
    </div>
    <div class="card span5"><div class="head"><div><h2>一時共有</h2><div class="muted">最後の保存・編集から12時間で自動削除</div></div><span class="badge warn">12時間</span></div><hr><div id="temps"></div></div>
    <div class="card span12"><h2>店舗へ正式保存した集計</h2><div class="muted">正式保存したデータは自動削除されません。</div><hr><div id="saved"></div></div>
  </div>
</div>
<dialog id="saveDialog"><form method="dialog">
<h2>店舗に正式保存</h2>
<div class="field"><label>店舗</label><select id="store"></select></div>
<div class="field" id="newStoreWrap" style="display:none"><label>新店舗名</label><input id="newStore"></div>
<div class="row"><div class="field"><label>日付</label><input id="date" type="date"></div><div class="field"><label>実戦に紐づける（任意）</label><select id="session"></select></div></div>
<div class="row" style="margin-top:8px"><div class="field"><label>分析用メーカー</label><select id="maker"></select></div><div class="field"><label>メーカー手動入力（任意）</label><input id="makerManual" placeholder="例：サミー"></div></div>
<div id="makerHint" class="muted" style="margin-top:5px"></div>
<div class="field" style="margin-top:8px"><label>メモ</label><input id="memo"></div>
<div class="row" style="margin-top:12px"><button value="cancel">キャンセル</button><button id="saveConfirm" value="default" class="primary">保存</button></div>
</form></dialog>
<div id="toast" class="toast"></div>
<script>
const KEY='slotStoreDashboard_v1',FBKEY='slotStoreFirebase_v1',TTL=12*60*60*1000;
const $=id=>document.getElementById(id),uid=()=>Math.random().toString(36).slice(2,10),nowIso=()=>new Date().toISOString();
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const num=n=>(Number(n)||0).toLocaleString('ja-JP');
const today=()=>{const d=new Date();const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
let state=load(),result=null,editing=null,sourceTemp=null,sync={mode:'local'};
const MAKERS=[
{name:'北電子',a:['北電子','KITADENSHI']},{name:'Sammy',a:['Sammy','サミー','ロデオ','タイヨーエレック','銀座']},
{name:'ユニバーサル',a:['ユニバーサル','ユニバーサルエンターテインメント','エレコ','ミズホ','メーシー','アクロス','アルゼ','ユニバーサルブロス']},
{name:'SANKYO',a:['SANKYO','三共','ビスティ','ジェイビー']},{name:'山佐',a:['山佐','YAMASA','セブンリーグ','山佐ネクスト']},
{name:'大都技研',a:['大都技研','大都','DAITO','サボハニ','パオンディーピー']},{name:'エンターライズ',a:['エンターライズ','ENTERRISE','アデリオン','レオスター','エンタープライズ']},
{name:'平和・オリンピア',a:['平和','HEIWA','オリンピア','OLYMPIA','アムテックス']},{name:'パイオニア',a:['パイオニア','PIONEER']},
{name:'KONAMI',a:['KONAMI','コナミ','コナミアミューズメント','KPE']},{name:'藤商事',a:['藤商事','JFJ']},{name:'NET',a:['NET','ネット','カルミナ']},
{name:'KYORAKU',a:['KYORAKU','京楽','オッケー']},{name:'ニューギン',a:['ニューギン','NEWGIN','エキサイト']},{name:'Daiichi',a:['DAIICHI','Daiichi','ダイイチ','D-light','ディライト']},
{name:'オーイズミ',a:['オーイズミ','OIZUMI']},{name:'SANYO',a:['SANYO','三洋','三洋物産','サンスリー','SANTHREE']},{name:'ベルコ',a:['ベルコ','BELLCO']},
{name:'岡崎産業',a:['岡崎産業']},{name:'七匠',a:['七匠']}
];
function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s&&s.stores){s.tempBoard=Array.isArray(s.tempBoard)?s.tempBoard:[];s.atypeRecords=Array.isArray(s.atypeRecords)?s.atypeRecords:[];s.customManufacturers=Array.isArray(s.customManufacturers)?s.customManufacturers:[];return s}}catch(e){}return {stores:[],sessions:[],tempBoard:[],atypeRecords:[],customManufacturers:[]}}
function purge(){state.tempBoard=(state.tempBoard||[]).filter(x=>new Date(x.updatedAt||x.createdAt||0).getTime()+TTL>Date.now())}
async function save(push=true){purge();localStorage.setItem(KEY,JSON.stringify(state));if(push&&sync.mode==='firebase')try{await sync.set(sync.ref(sync.db,'rooms/'+sync.room+'/state'),state)}catch(e){}}
function toast(t){$('toast').textContent=t;$('toast').style.display='block';setTimeout(()=>$('toast').style.display='none',1600)}
function norm(s){return String(s||'').normalize('NFKC').toLowerCase().replace(/株式会社|有限会社/g,'').replace(/[・･.\-_\s()（）]/g,'')}
function lev(a,b){a=norm(a);b=norm(b);let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){let c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function makerCatalog(){return [...new Set([...MAKERS.map(x=>x.name),...(state.customManufacturers||[])])]}
function resolveMaker(v){let raw=String(v||'').trim();if(!raw)return null;let entries=[];MAKERS.forEach(g=>[g.name,...g.a].forEach(a=>entries.push({c:g.name,a})));(state.customManufacturers||[]).forEach(x=>entries.push({c:x,a:x}));let ex=entries.find(x=>norm(x.a)===norm(raw));if(ex)return {c:ex.c,brand:raw,exact:true};let best=null;for(const e of entries){let score=1-lev(raw,e.a)/Math.max(norm(raw).length,norm(e.a).length,1);if(!best||score>best.score)best={c:e.c,brand:raw,score}}if(best&&best.score>=.78)return best;return {c:raw,brand:raw,newOne:true,suggest:best?.c||''}}
function makerOpts(sel=''){return '<option value="">未設定</option>'+makerCatalog().map(x=>`<option value="${esc(x)}" ${x===sel?'selected':''}>${esc(x)}</option>`).join('')}
function parse(){let raw=$('input').value,model=$('model').value.trim(),rows=[],bad=[];let lines=raw.split(/\r?\n/).map(x=>x.trim()).filter(Boolean),det='';for(let i=0;i<lines.length;i++){let s=lines[i].normalize('NFKC').replace(/　/g,' '),p=s.split(/[\s/]+/).filter(Boolean);if(p.length!==3&&s.includes(','))p=s.split(',').map(x=>x.trim()).filter(Boolean);if(p.length===3){let v=p.map(x=>Number(x.replace(/,/g,'')));if(v.every(x=>Number.isFinite(x)&&x>=0)&&v[0]>0){rows.push({games:Math.floor(v[0]),bb:Math.floor(v[1]),rb:Math.floor(v[2])});continue}}if(!model&&!det&&!/\d/.test(s))det=s;else bad.push({n:i+1,t:lines[i]})}if(!rows.length)return null;let g=rows.reduce((a,x)=>a+x.games,0),bb=rows.reduce((a,x)=>a+x.bb,0),rb=rows.reduce((a,x)=>a+x.rb,0),n=rows.length;return {model:model||det||'機種名未設定',rows,bad,summary:{count:n,totalG:g,bb,rb,avgG:g/n,avgBB:bb/n,avgRB:rb/n,bbProb:bb?g/bb:null,rbProb:rb?g/rb:null,combined:bb+rb?g/(bb+rb):null}}}
const pt=v=>v?`1/${v.toFixed(2)}`:'-';
function renderResult(){if(!result){$('result').innerHTML='<div class="empty">データを入力して計算してください。</div>';return}let s=result.summary;$('result').innerHTML=`<div class="card"><div class="head"><div><div class="muted">集計結果</div><div class="big">${esc(result.model)}</div></div><span class="badge info">${s.count}台</span></div><div class="stats"><div class="stat"><div class="muted">総G</div><div class="v">${num(s.totalG)}G</div></div><div class="stat"><div class="muted">BB</div><div class="v">${s.bb}</div></div><div class="stat"><div class="muted">RB</div><div class="v">${s.rb}</div></div><div class="stat"><div class="muted">1台平均</div><div class="v">${s.avgG.toFixed(2)}G</div><div class="muted">BB ${s.avgBB.toFixed(2)} / RB ${s.avgRB.toFixed(2)}</div></div><div class="stat"><div class="muted">BB / RB</div><div class="v">${pt(s.bbProb)}</div><div class="muted">RB ${pt(s.rbProb)}</div></div><div class="stat"><div class="muted">合算</div><div class="v">${pt(s.combined)}</div></div></div><div class="tablewrap"><table><thead><tr><th>#</th><th>G</th><th>BB</th><th>RB</th><th>BB確率</th><th>RB確率</th><th>合算</th></tr></thead><tbody>${result.rows.map((x,i)=>`<tr><td>${i+1}</td><td>${num(x.games)}</td><td>${x.bb}</td><td>${x.rb}</td><td>${pt(x.bb?x.games/x.bb:null)}</td><td>${pt(x.rb?x.games/x.rb:null)}</td><td>${pt(x.bb+x.rb?x.games/(x.bb+x.rb):null)}</td></tr>`).join('')}</tbody></table></div><hr><div class="row"><button id="tempBtn" class="warn">${editing?'一時データを更新':'一時保存して共有'}</button><button id="formalBtn" class="primary">店舗に正式保存</button><button id="copyBtn">結果コピー</button></div></div>`;$('tempBtn').onclick=saveTemp;$('formalBtn').onclick=openSave;$('copyBtn').onclick=copyRes}
function remain(x){let m=Math.ceil((new Date(x.updatedAt||x.createdAt).getTime()+TTL-Date.now())/60000);return m>60?`${Math.floor(m/60)}時間${m%60}分`:`${Math.max(0,m)}分`}
function renderTemps(){purge();let a=(state.tempBoard||[]).filter(x=>x.type==='atype').sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt)));$('temps').innerHTML=a.length?a.map(x=>`<div class="temp"><div class="head"><div><strong>${esc(x.model)}</strong><div class="muted">${x.summary.count}台 / ${num(x.summary.totalG)}G / BB${x.summary.bb} / RB${x.summary.rb}</div></div><span class="badge warn">残り ${remain(x)}</span></div><div class="row" style="margin-top:7px"><span class="badge">BB ${pt(x.summary.bbProb)}</span><span class="badge">RB ${pt(x.summary.rbProb)}</span><span class="badge info">合算 ${pt(x.summary.combined)}</span></div><div class="row" style="margin-top:8px"><button onclick="editTemp('${x.id}')">編集</button><button onclick="formalTemp('${x.id}')" class="good">正式保存</button><button onclick="delTemp('${x.id}')" class="danger">削除</button></div></div>`).join(''):'<div class="empty">一時共有なし</div>'}
function renderSaved(){let a=(state.atypeRecords||[]).slice().sort((a,b)=>String(b.createdAt).localeCompare(String(a.createdAt))).slice(0,30);$('saved').innerHTML=a.length?a.map(x=>`<div class="temp"><strong>${esc((state.stores.find(s=>s.id===x.storeId)||{name:'不明'}).name)} / ${esc(x.model)}</strong><div class="muted">${esc(x.date)} ${x.manufacturer?esc(x.manufacturer)+' / ':''}${x.summary.count}台 / ${num(x.summary.totalG)}G / 合算 ${pt(x.summary.combined)}</div></div>`).join(''):'<div class="empty">正式保存なし</div>'}
function render(){renderResult();renderTemps();renderSaved()}
$('calc').onclick=()=>{result=parse();if(!result)return toast('数値を読み取れませんでした');renderResult()};
$('example').onclick=()=>{$('model').value='';$('input').value='ハッピー\n2899 11 13\n2615 12 14\n1156 7 3\n1925 11 6';$('calc').click()};
$('clear').onclick=()=>{$('model').value='';$('input').value='';result=null;editing=null;renderResult()};
async function saveTemp(){if(!result)return;let t=nowIso();if(editing){let x=state.tempBoard.find(x=>x.id===editing);if(x)Object.assign(x,{model:result.model,rows:result.rows,summary:result.summary,sourceText:$('input').value,updatedAt:t})}else state.tempBoard.push({id:uid(),type:'atype',model:result.model,rows:result.rows,summary:result.summary,sourceText:$('input').value,createdAt:t,updatedAt:t});editing=null;await save();render();toast('12時間の一時共有に保存しました')}
window.editTemp=id=>{let x=state.tempBoard.find(x=>x.id===id);if(!x)return;editing=id;$('model').value=x.model;$('input').value=x.sourceText||x.rows.map(r=>`${r.games} ${r.bb} ${r.rb}`).join('\n');result={model:x.model,rows:x.rows,summary:x.summary,bad:[]};renderResult();window.scrollTo({top:0,behavior:'smooth'})};
window.delTemp=async id=>{state.tempBoard=state.tempBoard.filter(x=>x.id!==id);await save();renderTemps()};
window.formalTemp=id=>{let x=state.tempBoard.find(x=>x.id===id);if(!x)return;sourceTemp=id;result={model:x.model,rows:x.rows,summary:x.summary,bad:[]};openSave()};
function sessionsFor(storeId){return (state.sessions||[]).filter(x=>x.storeId===storeId).sort((a,b)=>String(b.date).localeCompare(String(a.date)))}
function refreshSessions(){let id=$('store').value;$('newStoreWrap').style.display=id==='__new__'?'':'none';$('session').innerHTML='<option value="">紐づけない</option>'+sessionsFor(id).map(s=>`<option value="${s.id}">${esc(s.date)} ${esc((s.events||[]).map(e=>e.name).join(' + ')||'実戦')}</option>`).join('')}
function openSave(){if(!result)return;$('store').innerHTML=(state.stores||[]).map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')+'<option value="__new__">＋新店舗を入力</option>';$('date').value=today();$('maker').innerHTML=makerOpts('');$('makerManual').value='';$('makerHint').textContent='';refreshSessions();$('saveDialog').showModal()}
$('store').onchange=refreshSessions;
$('makerManual').oninput=()=>{let r=resolveMaker($('makerManual').value);$('makerHint').textContent=!r?'':r.exact?`→ ${r.c} として保存`:r.newOne?`候補なし。新規「${r.c}」として保存可能`:`自動補完 → ${r.c}`};
$('saveConfirm').onclick=async e=>{e.preventDefault();if(!result)return;let storeId=$('store').value;if(storeId==='__new__'){let n=$('newStore').value.trim();if(!n)return toast('店舗名を入力してください');storeId=uid();state.stores.push({id:storeId,name:n,loanPer1000:0,exchangePer1000:0,trend:'',rateHistory:[],layout:[],customRules:[]})}let man=$('maker').value,brand=man,manual=$('makerManual').value.trim();if(manual){let r=resolveMaker(manual);if(r.newOne){state.customManufacturers=state.customManufacturers||[];if(!state.customManufacturers.includes(r.c))state.customManufacturers.push(r.c)}man=r.c;brand=r.brand}state.atypeRecords.push({id:uid(),storeId,date:$('date').value||today(),sessionId:$('session').value||'',model:result.model,manufacturer:man,brand,rows:result.rows,summary:result.summary,memo:$('memo').value.trim(),createdAt:nowIso()});if(sourceTemp)state.tempBoard=state.tempBoard.filter(x=>x.id!==sourceTemp);sourceTemp=null;await save();$('saveDialog').close();render();toast('正式保存しました')};
async function copyRes(){let s=result.summary,t=`${result.model}\n${s.count}台集計\n総G ${s.totalG} / BB ${s.bb} / RB ${s.rb}\n1台平均 ${s.avgG.toFixed(2)}G / BB ${s.avgBB.toFixed(2)} / RB ${s.avgRB.toFixed(2)}\nBB ${pt(s.bbProb)} / RB ${pt(s.rbProb)} / 合算 ${pt(s.combined)}`;try{await navigator.clipboard.writeText(t);toast('コピーしました')}catch(e){}}
async function autoFirebase(){try{let sv=JSON.parse(localStorage.getItem(FBKEY)||'{}');if(!sv.config||!sv.room)return;let appm=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js'),authm=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js'),dbm=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js');let app=appm.initializeApp(sv.config,'atype-'+Date.now()),auth=authm.getAuth(app);await authm.signInAnonymously(auth);let db=dbm.getDatabase(app),r=dbm.ref(db,'rooms/'+sv.room+'/state'),snap=await dbm.get(r);sync={mode:'firebase',db,room:sv.room,set:dbm.set,ref:dbm.ref};if(snap.exists()){state=snap.val();state.tempBoard=state.tempBoard||[];state.atypeRecords=state.atypeRecords||[];state.customManufacturers=state.customManufacturers||[];localStorage.setItem(KEY,JSON.stringify(state));render()}dbm.onValue(r,s=>{if(!s.exists())return;state=s.val();state.tempBoard=state.tempBoard||[];state.atypeRecords=state.atypeRecords||[];state.customManufacturers=state.customManufacturers||[];localStorage.setItem(KEY,JSON.stringify(state));render()});$('syncBadge').textContent='Firebase共有中';$('syncBadge').className='badge good'}catch(e){}}
purge();render();autoFirebase();setInterval(async()=>{let before=state.tempBoard.length;purge();if(before!==state.tempBoard.length)await save();renderTemps()},60000);
</script></body></html>
